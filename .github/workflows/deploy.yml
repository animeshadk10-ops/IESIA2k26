name: Deploy Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to Nginx
        run: |
          # Create folder
          sudo mkdir -p /var/www/html/iesia2026

          # Copy ONLY dist files
          sudo rsync -av --delete dist/ /var/www/html/iesia2026/

          # Permissions
          sudo chown -R www-data:www-data /var/www/html/iesia2026
          sudo chmod -R 755 /var/www/html/iesia2026

          # Nginx config
          sudo tee /etc/nginx/sites-available/iesia2026 <<EOF
          server {
              listen 80;
              server_name _;

              root /var/www/html/iesia2026;
              index index.html;

              location / {
                  try_files \$uri /index.html;
              }
          }
          EOF

          # Enable site
          sudo ln -sf /etc/nginx/sites-available/iesia2026 /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default

          # Reload nginx
          sudo nginx -t && sudo systemctl reload nginx
